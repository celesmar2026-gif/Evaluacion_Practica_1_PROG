<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado de Selección</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e8f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .result-box { background: white; padding: 2.5rem; border-radius: 12px; border-left: 5px solid #27ae60; box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center; }
        h1 { color: #2c3e50; font-size: 1.2rem; }
        .highlight { color: #27ae60; font-size: 2rem; font-weight: bold; display: block; margin: 10px 0; }
        a { color: #7f8c8d; text-decoration: none; font-size: 0.9rem; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="result-box">
        <h1>Selección Interceptada</h1>
        <p>Has elegido como animal favorito al:</p>
        <span class="highlight">{{nombre}}</span>
        <hr>
        <a href="/">Realizar una nueva búsqueda</a>
    </div>
</body>
</html>
