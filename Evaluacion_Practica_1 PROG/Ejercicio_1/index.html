<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Animal Favorito</title>
</head>
<body>
    <h1>Consulta de Animales</h1>
    <!-- El formulario envía el dato a la ruta /animal -->

        <label>¿Cuál es tu animal favorito?:</label>
        <input type="text" name="nombre" required>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
